<svg width="880" height="320" viewBox="0 0 880 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">ops.log — night station 696</title>
  <rect width="880" height="320" fill="#0A0B0A"/>
  <rect x="1" y="1" width="878" height="318" stroke="#C8CCD4" stroke-opacity="0.16"/>
  <text x="28" y="36" fill="#6A706C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">ops.log  ·  tty 696  ·  type help</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="28" y="76" fill="#C8CCD4">$ ping tower</text>
    <text x="28" y="100" fill="#8B919C">timeout. tower is a rumour.</text>
    <text x="28" y="124" fill="#8B919C">offline cache: HIT</text>
    <text x="28" y="148" fill="#8B919C">message still arrives.</text>
    <text x="28" y="184" fill="#C8CCD4">$ decrypt</text>
    <text x="28" y="208" fill="#E8E6E1">if (gap) create(rest);</text>
    <text x="28" y="244" fill="#C8CCD4">$ handshake</text>
    <text x="28" y="268" fill="#8B919C">don't pitch a slide. pitch a constraint.</text>
    <text x="28" y="300" fill="#C8CCD4">$</text>
    <rect x="44" y="286" width="8" height="16" fill="#C8CCD4">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
