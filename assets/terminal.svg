<svg width="880" height="280" viewBox="0 0 880 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
  <title id="t">ops.log — Leafy Shadow</title>
  <rect width="880" height="280" fill="#0A0B0A"/>
  <rect x="1" y="1" width="878" height="278" stroke="#C8CCD4" stroke-opacity="0.16"/>
  <text x="28" y="36" fill="#6A706C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">ops.log  ·  tty 696</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="28" y="72" fill="#C8CCD4">$ whoami</text>
    <text x="28" y="96" fill="#8B919C">frantisek · leafy shadow · czech republic</text>
    <text x="28" y="124" fill="#C8CCD4">$ ping tower</text>
    <text x="28" y="148" fill="#8B919C">timeout. switching to offline cache.</text>
    <text x="28" y="176" fill="#C8CCD4">$ echo mission</text>
    <text x="28" y="200" fill="#E8E6E1">if (gap) create(rest);</text>
    <text x="28" y="240" fill="#C8CCD4">$</text>
    <rect x="44" y="226" width="8" height="16" fill="#C8CCD4">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
