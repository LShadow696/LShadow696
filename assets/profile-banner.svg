    <path d="M24 64H1176"/><path d="M24 104H1176"/><path d="M24 144H1176"/><path d="M24 184H1176"/>
    <path d="M24 224H1176"/><path d="M24 264H1176"/><path d="M24 304H1176"/><path d="M24 344H1176"/>
