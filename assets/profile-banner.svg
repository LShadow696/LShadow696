  <text x="56" y="168" fill="#E8E6E1" font-family="Georgia, Times New Roman, serif" font-size="64">LEAFY SHADOW</text>
  <text x="56" y="214" fill="#8B919C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">František Kalášek  ·  Czech Republic  ·  49°N</text>
