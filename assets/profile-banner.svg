<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Leafy Shadow — station 696, carrier locked</title>
  <desc id="desc">if (gap) create(rest); Czech Republic, 49 degrees north.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121413"/>
      <stop offset="0.55" stop-color="#070807"/>
      <stop offset="1" stop-color="#0A0B0A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#night)"/>
  <rect x="18" y="18" width="764" height="364" stroke="#C8CCD4" stroke-opacity="0.16"/>
  <g stroke="#C8CCD4" stroke-opacity="0.62" stroke-width="1.25">
    <path d="M18 18H50M18 18V50"/>
    <path d="M782 18H750M782 18V50"/>
    <path d="M18 382H50M18 382V350"/>
    <path d="M782 382H750M782 382V350"/>
  </g>
  <g stroke="#C8CCD4" stroke-opacity="0.07">
    <path d="M18 78H520"/>
    <path d="M18 268H520"/>
    <path d="M18 332H782"/>
  </g>
  <text x="44" y="58" fill="#8B919C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2.6">STATION 696  ·  CARRIER LOCKED</text>
  <text x="44" y="162" fill="#E8E6E1" font-family="Georgia, 'Times New Roman', serif" font-size="78">LEAFY</text>
  <text x="44" y="248" fill="#E8E6E1" font-family="Georgia, 'Times New Roman', serif" font-size="78">SHADOW</text>
  <text x="44" y="312" fill="#C8CCD4" font-family="Georgia, 'Times New Roman', serif" font-size="26">if (gap) create(rest);</text>
  <rect x="392" y="290" width="10" height="22" fill="#C8CCD4">
    <animate attributeName="opacity" values="1;0;1" dur="1.15s" repeatCount="indefinite"/>
  </rect>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <circle cx="50" cy="360" r="3.5" fill="#C8CCD4">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="64" y="365" fill="#C8CCD4" letter-spacing="1.6">69.6 LOCK</text>
    <text x="196" y="365" fill="#6A706C" letter-spacing="1.4">49°N</text>
    <text x="268" y="365" fill="#6A706C" letter-spacing="1.4">DARK</text>
  </g>
  <g transform="translate(648 168)">
    <circle r="108" fill="#070807" stroke="#C8CCD4" stroke-opacity="0.22"/>
    <circle r="78" fill="none" stroke="#C8CCD4" stroke-opacity="0.16"/>
    <circle r="48" fill="none" stroke="#C8CCD4" stroke-opacity="0.16"/>
    <circle r="20" fill="none" stroke="#C8CCD4" stroke-opacity="0.22"/>
    <path d="M-108 0H108M0 -108V108" stroke="#C8CCD4" stroke-opacity="0.1"/>
    <g>
      <path d="M0 0 L0 -108" stroke="#C8CCD4" stroke-opacity="0.72" stroke-width="1.4"/>
      <path d="M0 0 L26 -104" fill="#C8CCD4" fill-opacity="0.08"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
    </g>
    <circle cx="44" cy="-56" r="3.5" fill="#E8E6E1">
