<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Leafy Shadow — František Kalášek</title>
  <desc id="desc">Signal locked. Czech Republic. Bridge the gap. Create the rest.</desc>
  <defs>
    <style>
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .sweep { animation: sweep 7s linear infinite; }
      .breathe { animation: breathe 5s ease-in-out infinite; }
